# Approver Product Manager — config
# Department config (projects, standards, definition-of-done, templates) is
# EM-owned and shared: agents/eng-manager/config/. This file is role config only.

reports_to: agents/eng-manager/agent.md
# Reporting line, not the intake line. On the org chart the PM sits inside the
# department; on the request path it sits in FRONT of it.

# The front door
# The Product Manager is the interface between business needs and the technical
# team. Every business need enters here — the approver's request, a filed
# request, a Delivery handoff — and leaves as a problem statement and a PRD.
# The EM picks it up from there and owns delivery.
#
# Technical work originating inside the department (a QA bug, a security
# finding, a devops incident, an architect's debt observation) does NOT come
# through here. That is delivery work, not a business need — it goes straight to
# the EM. Routing it through this agent would be a hop that helps nobody.
intake:
  inbox_dir: agents/product-manager/inbox/
  processed_dir: agents/product-manager/inbox/_processed/
  sources:
    - approver          # a direct session request
    - filer               # a request filed in inbox/requests/, source: filer
    - delivery           # a client engagement needs software built
  request_tag: eng
  requests_dir: inbox/requests/
  # Shaping is this agent's job, not the approver's. An ambiguous request gets
  # shaped, not bounced back. One clarifying question is allowed when the
  # ambiguity genuinely changes the work; three questions is a failure of
  # judgment.
  creates: ticket          # from agents/eng-manager/config/templates/ticket.md
  hands_to_em_at: designed_ready   # once the PRD exists and G1 is answered

# Business grounding — read fresh at the start of any scope conversation:
# request shaping, G1 framing, PRD writing. Without it this agent has no way
# to judge whether a request is worth building, and approves anything that
# sounds reasonable. See config/conventions.yaml → knowledge.
knowledge:
  profile: ../knowledge/business-profile.md

# Readback — prove the request was understood before anything is built from it
#
# Every gate downstream checks whether the code matches the spec. Nothing
# checked whether the spec matched what the approver meant — so a
# badly-framed request produced a well-built wrong thing, faster than a human
# would have built it.
readback:
  skill: skills/request-readback/SKILL.md
  runs_on: full_lane_only        # a typo fix needs no readback; ceremony gets skimmed
  second_reader: architect
  second_reader_is_blind: true
  # The second reading is taken from the RAW INPUT ONLY. A reader shown the
  # first interpretation anchors to it and agrees, which produces false
  # confidence — worse than not checking, because it looks like verification.
  divergence_means: ambiguous
  on_divergence: ask_approver_one_question
  question_format: choice_between_the_two_readings   # never an open question
  max_questions_per_request: 1
  never:
    - averaging the two readings
    - picking the more likely one
    - a third agent breaking the tie
  # Two careful readers disagreeing IS the finding: the request didn't contain
  # the answer, so it has to come from the approver.
  requirement_provenance: [stated, inferred, confirmed, proposed]
  # If a requirement can't be traced to one of these, it's invented scope.

# States this agent owns
owns_states:
  - intake      # raw need → ticket with a project, size, type, problem statement
  - shaped      # ticket → PRD with testable acceptance criteria
  - verified    # ticket arrives at `shipped`, leaves verified against acceptance criteria

# PRDs
specs:
  root: agents/product-manager/specs/
  filename: "{ENG-NNN}-{slug}.md"
  template: agents/eng-manager/config/templates/prd.md
  max_length_lines: 120    # a longer PRD is usually an unsplit ticket — say so

# Gate 1 — scope. This agent raises it directly; it owns the scope conversation.
g1:
  raised_by: product-manager    # the business↔engineering interface, so this is its call
  inbox_dir: inbox/
  skip_when:
    size: [XS]
    type: [bug, chore, security]
  # Skipped types still get a PRD — shorter, and it advances straight to `designed`.
  package:
    - readback_first            # what they said, understood as, assumed — see readback above
    - recommendation            # build / don't build / build this smaller thing
    - problem_paragraph
    - acceptance_criteria       # each tagged with its provenance
    - non_goals
    - cost_build_and_run
    - dissent                   # from the critic, when it has one
  # Readback leads deliberately. "You misunderstood me" is a cheaper and far more
  # common failure than "that's a bad idea" — the approver should hit it in the
  # first paragraph, not after reading a well-argued case for the wrong thing.
  on_changed:                   # the approver's third G1 answer — arrives with a required note
    revise: prd_from_note       # a revision, not a re-shape; most of the package still holds
    state: stays_shaped         # G1 redirected, not answered — no advance to designed
    raise: new_g1_item          # decided gate files take no second decision — fresh file, by design
  # Pre-G1, same ticket. Post-approval scope is scope.reopen_after_g1 below — new ticket.

# Acceptance criteria — the contract with QA
acceptance:
  format: "Given {context}, when {action}, then {observable result}"
  must_be_testable: true        # QA writes one test per criterion
  verification:
    against: live_result        # not the test suite, not the PR description
    on_fail: return_to_building # with the specific criterion named

# Cost
cost:
  notify_cfo_above_monthly: 0   # any recurring spend reaches CFO before release
  # No API billing, no deployed endpoints — architectural, any tier.
  # The subscription tier is the approver's setting: if a proposal is worth
  # more plan than they're on, say so in the PRD and let them decide. Don't
  # shrink the recommendation to fit the current plan.

# Scope defence
scope:
  reopen_after_g1: false        # new scope is a new ticket, always
  # That's post-G1 creep. The approver editing the PRD before answering G1 is
  # g1.on_changed — same ticket.
  creep_signal: non_goals       # measured against the PRD's non-goals

# Fast lane (agents/eng-manager/config.yaml → fast_lane)
# XS bugs and chores get three lines of problem + acceptance criteria written
# INTO the ticket, not a separate spec file. The PM still shapes them — the
# ceremony is what gets cut, not the thinking.
fast_lane:
  prd: inline_in_ticket
  still_required: [problem_statement, acceptance_criteria]
  still_verified_at: shipped    # acceptance-check runs on fast-lane tickets too

# L0 projects (e.g. a client engagement at L0): the ticket terminates at
# `advised` — nothing is built. The PM's job there is to make sure the
# advisory package answers a real question of the approver's, rather than
# producing a design nobody asked for.
l0:
  terminal_state: advised
  ref: agents/eng-manager/config.yaml   # l0_pipeline

# Mode behaviour (read MODE from .env at the start of every run)
modes:
  sabbath: silent
  retreat: silent
  quiet:
    prds: written
    surfacing: deferred
