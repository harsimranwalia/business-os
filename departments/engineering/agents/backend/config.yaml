# Lead Backend Engineer — config
# Department config is EM-owned and shared: agents/eng-manager/config/.

reports_to: agents/eng-manager/agent.md

owns_states:
  - building     # shared with frontend and database; the EM assigns per sub-ticket

surface:
  - apis_and_services
  - background_jobs_queues_crons
  - third_party_integrations_and_mcp
  - server_side_data_access

# Branching
git:
  branch_pattern: "{type}/{ENG-NNN}-{slug}"
  never_commit_to: [main, master]
  # True at every autonomy level. L2/L3 merge happens at the release step,
  # after all machine gates — never as a shortcut during `building`.

# Non-negotiables on every network call
resilience:
  timeout: required
  retries: { bounded: true, backoff: exponential }
  idempotency_key_on_non_idempotent_writes: required
  fail_closed_on: [auth, payments, deletion]

# Boundary validation — every external input is parsed before use
validate_at_boundary:
  - http_bodies_and_params
  - webhook_payloads          # and verify the signature, always
  - env_vars
  - file_contents
  - model_output              # schema-validated, per ai-architecture-standards.md

# Tests — written here, reviewed and extended by qa
tests:
  written_by: backend
  regression_test_on_every_bug_fix: required   # must fail against the old code
  no_real: [production, email, payments, model_endpoints]

# Observability — required before the change leaves `building`
observability:
  log_on_new_failure_paths: required
  never_log: [pii, secrets, tokens]
  jobs_report_success_and_failure_to: devops

# Requests to other agents
requests:
  schema_change:
    to: database
    include: [what_to_store, query_patterns, expected_volume, growth_rate]
  api_contract:
    agreed_with: frontend
    before: implementation
    includes: [request_shape, response_shape, error_shape, status_codes]

# PR description — the reviewer's context
pr_description:
  requires: [what_it_does, what_it_deliberately_does_not, uncertainties, what_to_review_hardest]

# Shift left (added 2026-07-27) — the cheapest speed available is not failing
# the gate in the first place. A rework round costs a full gate cycle; reading
# the checklist first costs nothing.
shift_left:
  read_before_writing:
    - agents/eng-manager/config/engineering-standards.md   # the automatic-failure list especially
    - agents/eng-manager/config/security-baseline.md       # the OWASP rows this change can touch
    - the acceptance criteria QA will write tests against
  self_check_before_handoff: true
  # Walk the automatic-failure list against your own diff before setting
  # `in-review`. Every one you catch yourself saves a full round trip.

# Mode behaviour (read MODE from .env at the start of every run)
modes:
  sabbath: silent
  retreat: silent
  quiet: runs
