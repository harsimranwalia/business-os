# Engineering department — template contract
#
# This file is the seam between the shared department and a business that runs
# it. The template is read-only at runtime; an instance is the only thing ever
# written to. Every agent, skill and script in this department resolves its
# paths through the two roots below and never hardcodes a repository path.
#
# Ported from life-os 2026-08-22. See docs/engineering-team.md for the pipeline
# and gates, which are unchanged by the port.

template:
  version: 1.0.0
  layout: agent-dir        # agents/{name}/agent.md + config.yaml (not .claude/agents/*.md)
  origin: life-os@2026-08-22

# ---------------------------------------------------------------------------
# The two roots. Everything else is relative to one of them.
# ---------------------------------------------------------------------------
roots:
  dept:
    env: ENG_DEPT
    is: departments/engineering
    writable: false        # a pass that writes here is a bug — fix the template deliberately, via git
  instance:
    env: ENG_INSTANCE
    is: instances/{business}/engineering
    writable: true         # all board state, artifacts, traces and memory

# ---------------------------------------------------------------------------
# Instance layout — what the department writes, always instance-relative.
#
# Deliberately mirrors the life-os agent-directory shape rather than inventing
# a tidier one. lib/eng-gate-check.sh hardcodes its receipt paths
# (agents/principal-engineer/reviews/%ID%.md and siblings), and per ADR-002 the
# scripts are the only enforceable surface this department has. A prettier
# layout would mean editing the enforcement to match the decoration. So an
# instance root IS a life-os-shaped root: point ENG_ROOT at it and gate-check
# runs unmodified.
# ---------------------------------------------------------------------------
instance_layout:
  inbox:     inbox/                # gate items awaiting the approver (was input/inbox/)
  requests:  inbox/requests/       # filed by a filer, drained by the PM at intake
  traces:    traces/               # run logs, loop lock, trigger queue (was traces/eng/)
  reports:
    root:  reports/                # the weekly report — terminal for now, the approver reads it or doesn't
    costs: reports/costs/          # per-release cost notices (was agents/cfo/inbox/) — rewires to a finance department if one exists
    proof: reports/proof/          # optional proof-of-work entries (was input/proof/problem-solution-result/) — rewires to a marketing department if one exists
  agents:
    eng-manager:
      board:  agents/eng-manager/board/          # tickets, _index.md, _index-archive.md
      log_archive: agents/eng-manager/board/_log-archive/  # {TICKET}.md — rolled-off log entries, see ticket_log.archive
      config: agents/eng-manager/config/         # projects.md, gate-waivers.md, exceptions.md, decision-journal.md
      inbox:  agents/eng-manager/inbox/
      notebook: agents/eng-manager/notebook/
      observations: agents/eng-manager/observations.md
      proposals:    agents/eng-manager/proposals.md
    product-manager:    { specs: agents/product-manager/specs/,   inbox: agents/product-manager/inbox/ }
    architect:          { designs: agents/architect/designs/,     decisions: agents/architect/decisions/ }
    principal-engineer: { reviews: agents/principal-engineer/reviews/ }
    qa:                 { test_plans: agents/qa/test-plans/,      bugs: agents/qa/bugs/ }
    security:           { reviews: agents/security/reviews/ }
    devops:             { releases: agents/devops/releases/,      incidents: agents/devops/incidents/ }
    database:           { migrations: agents/database/migrations/ }
  notebooks: agents/{agent}/notebook/   # per-agent memory. NEVER shared across instances.
  config:
    overrides:         config/config.yaml          # approver, filers, tier, WIP caps, cadence
    instantiated_from: config/instantiated-from    # template VERSION this instance was built at

# ---------------------------------------------------------------------------
# Roles. The template names roles; the instance binds people to them in
# config/config.yaml. No agent, skill or script may name a person.
# ---------------------------------------------------------------------------
roles:
  approver:
    is: the single human with gate authority
    owns: [g1_scope, g2_one_way_door, g3_release]
    note: >
      Exactly one per instance. The five machine gates (code review, migration,
      quality, release readiness, security) remain machine-owned and blocking;
      only the approver overrides one, explicitly, logged as an ADR.
  filer:
    is: a human who may submit a request, with no gate authority
    owns: []
    note: >
      Requests land in inbox/requests/ carrying `source: filer` and the filer's
      name. The PM shapes them like any other intake. A filer never receives a
      gate and never appears in the approval path.

# ---------------------------------------------------------------------------
# Business knowledge seam.
#
# life-os's PM read clone/identity/aims.md and values.md to answer "is this
# worth building". Those are one person's files and were cut during the port,
# correctly — but nothing replaced them, which left the PM shaping scope against
# nothing. A business grounds the same judgement in its own facts.
# ---------------------------------------------------------------------------
knowledge:
  source: ../knowledge/             # instances/{business}/knowledge/ — PER BUSINESS, not repo-root
  # Scoped to the business deliberately. business-os's repo-root knowledge/ is a
  # single-instance artifact from before this department existed: one profile
  # describing one company. A second business reading it would shape scope
  # against the wrong company's facts — the PM would approve anything that
  # sounded reasonable. It sits beside `engineering/` rather than inside it
  # because it describes the business, not the department: a marketing
  # department instantiated later reads the same file.
  files:
    profile: business-profile.md    # what the business is, who it serves, what it sells
  read_by: [product-manager, architect]
  rule: >
    Read fresh at the start of any scope conversation — request shaping, G1
    framing, and PRD writing. A PM that cannot say what the business does cannot
    say whether a request is worth building, and will approve anything that
    sounds reasonable.

# ---------------------------------------------------------------------------
# Pause switch. business-os convention, honoured by every existing component.
# Replaces life-os's clone/context/modes.md.
# ---------------------------------------------------------------------------
mode:
  source: .env
  key: MODE
  halt_values: [sabbath, retreat, quiet]
  rule: >
    Checked inside every component at start of run, never by the scheduler.
    Cron keeps firing; the component exits immediately and silently. An empty
    or unset MODE means normal operation.

# ---------------------------------------------------------------------------
# Release freeze — distinct from a halt, and the reason it exists separately.
#
# life-os expressed this as `travel` and `sick` modes: the approver is reachable
# enough that work continues, but not available to respond if a production
# release goes wrong. That is not a halt (nothing stops) and it is not normal
# operation (nothing ships). It needed its own slot rather than being folded
# into MODE, which is why both the agent and docs batches flagged `travel` as
# undefined against this file.
# ---------------------------------------------------------------------------
release_freeze:
  source: .env
  key: ENG_RELEASE_FREEZE
  set_when: any non-empty value
  rule: >
    Blocks production releases only. The build loop keeps running, tickets keep
    advancing, and everything up to `ready-to-ship` proceeds normally. G3 is
    simply not offered while this is set. P0 hotfixes are the documented
    exception, same as under life-os.

# ---------------------------------------------------------------------------
# Notification seam. The instance chooses the channel; the department only
# calls the command. Replaces life-os's brief-composer + slack-reply-router.
# ---------------------------------------------------------------------------
notify:
  command: lib/eng-notify.sh
  channels: [telegram, slack, none]
  default: telegram
  rule: >
    The department never formats for a specific channel. It hands eng-notify.sh
    a mode and an item path; the instance's config decides where that goes and
    how a reply comes back.

# ---------------------------------------------------------------------------
# Authoring the template itself. roots.dept is writable: false — no pass ever
# edits an agent or skill definition file; only a deliberate, git-tracked
# change does (see roots.dept above). The approver's instruction, 2026-08-29:
# that deliberate authoring is done with the Fable model only.
# ---------------------------------------------------------------------------
authoring:
  scope:
    - agents/**      # agent.md, config.yaml, and everything under an agent's own dir — this template AND every instance's
    - skills/**       # SKILL.md and everything under a skill's own dir
    - business-os root: .claude/agents/*.md, .claude/skills/*/SKILL.md
  model: fable
  rule: >
    Any update to an agent or skill definition file — this department's
    template, an instance's copy, or business-os's own .claude/agents/ and
    .claude/skills/ — is written with the Fable model, never Sonnet/Opus/Haiku,
    regardless of which model is driving the session that requests the change.
    Schedules, docs, lib/ scripts, and shared contract files like this one are
    outside this rule's scope; only files inside an agent's or a skill's own
    directory are covered.

# ---------------------------------------------------------------------------
# Naming. Was life-os config/settings.yaml.
# ---------------------------------------------------------------------------
naming:
  ticket:         "ENG-{NNN}-{slug}.md"
  adr:            "ADR-{NNN}-{slug}.md"
  design:         "{TICKET}-{slug}.md"
  release_record: "{YYYY-MM-DD}-{project}-{TICKET}.md"
  trace:          "eng-loop-{YYYY-MM-DD}.log"

# ---------------------------------------------------------------------------
# Ticket log — size discipline.
#
# The log is this department's audit trail and it stays COMPLETE. Nothing here
# permits dropping a fact. What it caps is prose, and where the prose lives.
#
# Measured 2026-09-02 across 132 passes (instance traces/costs-*.jsonl).
# ENG-010's ticket file reached 105,964 bytes by its eighth hop of the day, up
# from 23,440 that morning. Of its 1,708 lines, 114 were the ticket and 1,594
# — 93% — were this log. A single state transition was running to ~60 lines,
# and one reached 188. Every hop re-read all of it, and because a pass averages
# ~46 turns, each token read at the start was paid for about forty-six times
# over inside that one pass. The log had become the most expensive artifact in
# the department while carrying, per hop, roughly ten lines anyone later needed.
#
# The split below is the fix: the FACTS stay on the ticket, where the audit
# trail and every later sweep expect them; the REASONING moves to the writing
# agent's own notebook, which nothing re-reads on every hop. Both are durable,
# both are committed, and the entry carries the pointer between them — so this
# is a change of address for the analysis, never a deletion of it.
# ---------------------------------------------------------------------------
ticket_log:
  entry:
    cap_lines: 20
    over_cap_allowed_when: [gate_fail, incident, approver_answer_verbatim]
    must_record:
      - date, and the state transition as from -> to
      - the agent that made it, and the event that drove the hop
      - gate outcome when a gate ran — pass/fail plus the finding in one line
      - receipt files written, by path
      - WIP / approval cap consequences, when any changed
      - "chained: {TICKET-ID} or chained: none — {reason}, always, per lib/eng-trigger.sh"
      - the notebook path holding this hop's reasoning, when there was any
    reasoning_goes_to: agents/{agent}/notebook/{YYYY-MM-DD}-{topic}.md
    rule: >
      An entry records what changed and what the next hop must know. It is not
      where a hop narrates how it got there. Investigation, alternatives
      weighed, evidence read, and rationale go to the writing agent's own
      notebook under the instance, and the entry carries the path to it in one
      line. The cap is on the entry, never on the notebook — write as much
      there as the work deserves. The three over-cap cases are the ones where
      the finding IS the audit trail: a gate FAIL states what failed and why in
      full, an incident states what happened, and an approver's answer is
      preserved verbatim per skills/request-readback/SKILL.md. Even then the
      analysis behind it goes to the notebook; only the finding stays here.
  reading:
    rule: >
      Read the log by RANGE, not by opening the file. lib/eng-trigger.sh hands
      a continue hop the frontmatter and the newest entry in its prompt, plus
      the line number that entry starts at, precisely so the common case needs
      no read at all. When a hop genuinely needs earlier history — a chain that
      broke, a decision being revisited, a receipt being traced — it reads the
      range it needs with sed -n and says in its own entry which range and why.
      Opening a long ticket file whole is a defect, not thoroughness: on the
      tickets measured above it costs ~25k tokens to surface about ten relevant
      lines, and every one of those tokens is then re-read on every later turn
      of the same pass.
  archive:
    file: agents/eng-manager/board/_log-archive/{TICKET}.md
    trigger_bytes: 40000
    rule: >
      When a ticket file passes trigger_bytes, the EM moves log entries older
      than the ticket's current state into the archive file above — oldest
      first, newest last, unchanged, never summarised and never edited on the
      way. Always leave at least the three newest entries in place, and never
      move the entry for the state the ticket currently sits in. The ticket's
      Log section then opens with one line naming the archive file and the
      entries it holds, so the trail is followed, not guessed at. This mirrors
      _index.md -> _index-archive.md, which the board index has used since
      2026-08; the difference is only that a per-ticket archive is keyed by
      ticket id.
    location_is_load_bearing: >
      The archive lives in a SUBDIRECTORY of board/ and is named {TICKET}.md,
      not {TICKET}-{slug}.md beside the ticket. lib/eng-gate-check.sh enumerates
      the board with find -maxdepth 1 -name 'ENG-*.md', and lib/eng-trigger.sh
      resolves a ticket with the same non-recursive shape. An archive sitting
      beside its ticket would be read as a second, malformed ticket with no
      frontmatter — which is a fail-closed exit 2 across the whole board, not a
      quiet mis-parse. Keep it one level down.
