# Instance overrides for aiorders. The template supplies every default;
# this file only records what is true for this business.

business: aiorders
instantiated_from: 1.0.0

# The single human with gate authority. Owns G1 scope, G2 one-way-door and
# G3 release. The five machine gates stay machine-owned and blocking.
approver:
  name: Harry
  notify: telegram

# Humans who may file a request but hold no gate authority. Their requests land
# in inbox/requests/ with `source: filer` and are shaped by the PM like any
# other intake. A filer never receives a gate.
filers: []

# Pause switch for THIS business only. sabbath | retreat | quiet halt every pass
# for this instance; empty means normal operation. Falls back to MODE in
# business-os/.env when empty, so the global switch still stops everything at
# once — this only adds the ability to stop one business without stopping the
# rest.
mode:

# Delivery caps. Raising these is the approver's call.
wip:
  machine_limit: 1      # states ready..ready-to-ship — the machine's range,
                        # nothing else. Corrected 2026-08-29,
                        # same day: was raised to 12 (the max_5x tier value)
                        # that morning, then the approver overrode the whole
                        # tier-scaled model — 12 in flight meant every pass
                        # advanced six-plus tickets by one shallow step each
                        # and nothing shipped. One ticket in flight on the
                        # machine, worked end to end to a raised PR, before
                        # the next starts. See departments/engineering/agents/eng-manager/config.yaml
                        # → wip.machine_limit for the full rationale.
                        # Amended 2026-09-06 by the approver — never idle:
                        # "It should not wait for a ticket to be merged before
                        # building another one. You can build all tickets and
                        # keep sending it for PR merge that I can do at my own
                        # convenience." Until then "before the next starts"
                        # meant through `shipped`, so the department idled for
                        # as long as a PR sat unmerged waiting on Harry. Now
                        # the moment a ticket parks on him (blocked_on:
                        # approver with its PR open, or awaiting-release) its
                        # machine slot is free and the same pass chains the
                        # top of To-do into it (priority → severity → ticket
                        # id; log `chained: {NEXT-ID} — slot freed by
                        # {TICKET-ID}`). A pile of unmerged PRs is the design.
                        # The parked ticket counts against approver_limit
                        # (unlimited here, below), never against this. A next
                        # ticket that needs code only in an unmerged PR
                        # branches from that PR's branch as a stacked PR and
                        # says so in its merge request. When nothing can
                        # start, the EM raises ONE "Nothing I can start"
                        # question item in inbox/ (gate: intake-question)
                        # saying what blocks each candidate and what would
                        # clear it — "Give me a reason if something is really
                        # blocked on and you can not continue." — never a
                        # second while one is undecided, and logs
                        # `chained: none — idle: {reason}`.
  approver_limit: unlimited   # was 2. Raised to no-cap 2026-09-02 by the approver: the
  # anti-burnout intent (don't bury Harry in finished-but-unapproved work) is
  # explicitly waived by the one person it protects, because the department
  # stalling dispatch of new work while old work sits waiting on him is a worse
  # outcome than the pile itself. Read as no limit at all — never withhold a
  # new ticket for this reason, no matter how many are already blocked_on:
  # approver. Everything else about the approver gates is unchanged: still
  # notified immediately, still nudged once after 24h, still needs an explicit
  # decision — only the "don't start new work while old work waits on me"
  # dispatch guard is lifted.
  # approval_cap removed 2026-08-29 by the approver — a life-os holdover; business-os has no cap on decisions queued for the approver

# Business knowledge the PM and architect read before any scope conversation.
# See config/conventions.yaml → knowledge.
knowledge:
  source: ../../../knowledge/
  profile: business-profile.md      # AIOrders — restaurant tech, commission-free direct ordering

# Cost ceiling. Nothing here bills the Anthropic API; this is the subscription
# tier the department's model routing sizes itself against.
plan_ref: departments/engineering/agents/eng-manager/config.yaml   # → plan.tier
