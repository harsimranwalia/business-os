<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business OS — Control Center</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --card: #1e1e24;
      --card-hover: #24242c;
      --border: #2a2a35;
      --border-light: #32323f;
      --text: #e2e2ec;
      --muted: #5c5c72;
      --muted-mid: #8888a0;
      --agent: #8b5cf6;
      --done: #10b981;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    .header { display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 16px; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo { width: 26px; height: 26px; background: linear-gradient(135deg, var(--agent), #6366f1);
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 600; }
    .header-title span { color: var(--muted); font-weight: 400; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .live-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted-mid);
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }
    .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--done); animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
    .header-date { font-size: 12px; color: var(--muted); }

    /* ── Tabs ── */
    .tab-nav { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab-btn { padding: 9px 16px; font-size: 12px; font-weight: 500; color: var(--muted); background: none;
      border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit;
      transition: color .15s, border-color .15s; margin-bottom: -1px; }
    .tab-btn:hover { color: var(--muted-mid); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--agent); }

    .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
    .view.active { display: flex; }

    /* ── Toolbar ── */
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap; }
    .instance-select { padding: 5px 9px; font-size: 11px; font-weight: 600; color: var(--text);
      background: rgba(99,102,241,.1); border: 1px solid var(--agent); border-radius: 6px; cursor: pointer;
      font-family: inherit; margin-right: 4px; }
    .filter-btn { padding: 5px 11px; font-size: 11px; font-weight: 500; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-family: inherit; transition: all .12s; }
    .filter-btn:hover { color: var(--muted-mid); }
    .filter-btn.active { color: var(--text); background: rgba(99,102,241,.1); border-color: var(--agent); }
    .toolbar-spacer { flex: 1; }
    .refresh-btn { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer;
      font-size: 13px; padding: 4px 9px; border-radius: 6px; }
    .refresh-btn:hover { color: var(--text); }
    .btn { padding: 6px 14px; font-size: 12px; font-family: inherit; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border-light); background: none; color: var(--muted-mid); }
    .btn:hover { background: var(--card-hover); color: var(--text); }
    .btn.yes { border-color: rgba(16,185,129,.5); color: #34d399; }
    .btn.yes:hover { background: rgba(16,185,129,.14); }
    .btn.no { border-color: rgba(239,68,68,.45); color: #f87171; }
    .btn.no:hover { background: rgba(239,68,68,.12); }
    .btn.edit { border-color: rgba(245,158,11,.5); color: #fbbf24; }
    .btn.edit:hover { background: rgba(245,158,11,.14); }
    .btn:disabled { opacity: .5; cursor: default; }

    .scroll { flex: 1; overflow-y: auto; padding: 20px; }
    .scroll::-webkit-scrollbar { width: 5px; }
    .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }

    input, textarea { background: var(--bg); border: 1px solid var(--border-light); border-radius: 6px;
      padding: 9px 11px; color: var(--text); font-family: inherit; font-size: 13px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--agent); }

    /* ── Section / card language (shared eng + marketing + sales) ── */
    .section { margin-bottom: 28px; }
    .h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-mid);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .h .count { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
      margin-bottom: 10px; }
    .card.accent { border-color: rgba(139,92,246,.45); background: rgba(139,92,246,.05); }
    .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .title { font-size: 14px; font-weight: 500; color: var(--text); }
    .body-text { font-size: 13px; color: var(--muted-mid); margin-top: 6px; line-height: 1.5; white-space: pre-wrap; }
    .body-text strong { color: var(--text); font-weight: 600; }
    .body-text h2 { color: var(--text); font-size: 12px; font-weight: 700; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
    .body-text h2:first-child { margin-top: 0; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border-light);
      color: var(--muted-mid); text-transform: uppercase; letter-spacing: .04em; }
    .tag.gate { border-color: rgba(139,92,246,.5); color: #a78bfa; }
    .tag.p0, .tag.p1 { border-color: rgba(239,68,68,.55); color: #f87171; }
    .tag.time-impact { background: #92400e; color: #fff; border-color: transparent; }
    .meta.warn { color: #fbbf24; }
    .now-line { font-size: 12px; color: var(--muted-mid); margin-top: 8px; line-height: 1.4;
      padding-left: 10px; border-left: 2px solid rgba(139,92,246,.45); }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
    .status-dot.dot-on { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,.7); }
    .status-dot.dot-off { background: var(--muted); }
    .activity-detail { margin-top: 8px; font-size: 11px; }
    .activity-detail summary { cursor: pointer; color: var(--muted-mid); }
    .queue-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .queue-row { font-size: 11px; color: var(--muted-mid); }
    .log-tail { font-size: 10px; color: var(--muted-mid); background: var(--surface);
      border-radius: 6px; padding: 8px; margin-top: 6px; overflow-x: auto; white-space: pre-wrap; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .decide-note { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; font-size: 12px; }
    .note-text { font-size: 11px; color: var(--muted); }
    .intake-box { display: flex; flex-direction: column; gap: 8px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }

    .stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat { font-size: 12px; color: var(--muted-mid); }
    .stat b { display: block; font-size: 20px; color: var(--text); font-weight: 500; }
    .stat.over b { color: #fbbf24; }

    /* ── Marketing: channel pills + the settings rows ── */
    .chan-h { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .chan-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .tier { font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-light);
      color: var(--muted-mid); letter-spacing: .04em; }
    .tier.c0 { border-color: var(--border-light); color: var(--muted); }
    .tier.c1 { border-color: rgba(251,191,36,.5); color: #fbbf24; }
    .tier.c2 { border-color: rgba(52,211,153,.5); color: #34d399; }
    .set-row { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; align-items: start;
      margin-top: 12px; font-size: 12px; }
    .set-row label { color: var(--muted); padding-top: 4px; }
    .set-locked { color: var(--muted-mid); padding-top: 4px; }
    .set-in { width: 110px; padding: 4px 8px; font-size: 12px; font-family: inherit; }
    .set-days { display: flex; gap: 4px; flex-wrap: wrap; }
    .set-day, .set-toggle { padding: 4px 9px; font-size: 11px; font-family: inherit; cursor: pointer;
      border-radius: 5px; border: 1px solid var(--border-light); background: var(--surface);
      color: var(--muted-mid); }
    .set-day.on, .set-toggle.on { border-color: rgba(52,211,153,.6); color: #34d399; }
    .set-saved { font-size: 11px; color: #34d399; }
    .set-err { font-size: 11px; color: #f87171; }
    .set-src { font-size: 10px; color: var(--muted); margin-bottom: 12px; }
    .quiet { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }

    /* ── Engineering board lanes ── */
    .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .lane { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .lane-h { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
    .lane-empty { color: var(--muted); opacity: .45; font-size: 12px; padding: 6px 2px; }
    .mini { background: var(--card); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; color: var(--text); }
    .mini .sub { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .mini-title { line-height: 1.35; }
    .mini-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .mini-tags:empty { display: none; }
    .tag.stage { background: transparent; border: 1px solid var(--border-light); }
    .tag.live { background: #0f766e; color: #fff; border-color: transparent; }
    .mini.mini-active { border: 1px solid rgba(52,211,153,.55); background: rgba(52,211,153,.07);
      box-shadow: 0 0 0 1px rgba(52,211,153,.12); }
    .tag.prio-now  { background: #b45309; color: #fff; border-color: transparent; }
    .tag.prio-next { background: #1d4ed8; color: #fff; border-color: transparent; }
    .tag.prio-hold { background: #52525b; color: #fff; border-color: transparent; }
    .prio-row { display: flex; gap: 4px; margin-top: 6px; }
    .prio-btn { font: inherit; font-size: 10px; line-height: 1; padding: 3px 7px; border-radius: 5px;
      border: 1px solid var(--border-light); background: none; color: var(--muted); cursor: pointer; }
    .prio-btn:hover { color: var(--text); border-color: var(--muted); }
    .prio-btn.on { background: var(--text); color: var(--card); border-color: var(--text); }
    .boardbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }

    /* ── Funnel (Sales) ── */
    .totals { display: flex; gap: 18px; align-items: baseline; margin-bottom: 14px; }
    .totals .n { font-size: 20px; font-weight: 700; color: var(--text); }
    .totals .l { font-size: 11px; color: var(--muted); }
    .cols { display: flex; gap: 10px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; }
    .col { flex: 0 0 250px; min-width: 0; max-width: 250px; background: rgba(255,255,255,.02);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .col.drag-over { outline: 1px dashed rgba(139,92,246,.5); outline-offset: -2px; }
    .col-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .col-name { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-mid); }
    .col-count { font-size: 10px; color: var(--muted); }
    .lead-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
      margin-bottom: 7px; cursor: pointer; transition: border-color .12s; }
    .lead-card:hover { border-color: var(--agent); }
    .lead-card.dragging { opacity: .4; }
    .lead-who { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.35; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .lead-co { font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lead-note { font-size: 10.5px; color: var(--muted-mid); line-height: 1.45; margin-top: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lead-meta { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    .chip { font-size: 9px; font-weight: 500; padding: 1px 6px; border-radius: 3px; background: rgba(255,255,255,.06);
      color: var(--muted-mid); text-transform: uppercase; letter-spacing: .04em; }
    .stale { color: #e0a03c; font-size: 10px; font-weight: 600; }
    .due-dot { width: 6px; height: 6px; border-radius: 50%; background: #e0a03c; }
    .empty-col { font-size: 10.5px; color: var(--muted); padding: 4px 2px; }

    /* ── Marketing cards ── */
    .mkt-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .mkt-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .mkt-title-wrap { min-width: 0; }
    .mkt-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .mkt-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .status-pill { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .status-pill.PENDING { background: rgba(245,158,11,.14); color: #fbbf24; }
    .status-pill.APPROVED { background: rgba(59,130,246,.14); color: #60a5fa; }
    .status-pill.POSTED { background: rgba(16,185,129,.14); color: #34d399; }
    .status-pill.DISCARDED { background: rgba(120,120,140,.14); color: var(--muted-mid); }
    .status-pill.FAILED { background: rgba(239,68,68,.14); color: #f87171; }
    .mkt-body-view { font-size: 12.5px; color: var(--muted-mid); line-height: 1.6; white-space: pre-wrap; margin-top: 10px; }
    .mkt-body-edit { width: 100%; margin-top: 10px; font-size: 12.5px; line-height: 1.6; min-height: 90px; }
    .mkt-rationale { font-size: 11.5px; color: var(--muted); margin-top: 8px; font-style: italic; }
    .mkt-link { font-size: 11px; color: #60a5fa; margin-top: 6px; display: inline-block; }

    /* ── Cost ── */
    .cost-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    .cost-table th { text-align: right; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); padding: 0 9px 6px; }
    .cost-table th:first-child, .cost-table td:first-child { text-align: left; }
    .cost-table th:nth-child(2), .cost-table td:nth-child(2),
    .cost-table th:nth-child(3), .cost-table td:nth-child(3) { text-align: left; }
    .cost-table td { padding: 8px 9px; border-bottom: 1px solid var(--border); color: var(--muted-mid); text-align: right; white-space: nowrap; }
    .cost-table tr:hover td { background: rgba(255,255,255,.02); }
    .cost-name { color: var(--text); font-weight: 600; }
    .cost-stats { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 22px; }
    .cost-stat b { display: block; font-size: 21px; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .cost-stat span { font-size: 11px; color: var(--muted); }
    .cost-tier { font-size: 10px; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .cost-tier.classification { background: rgba(52,211,153,.12); color: #34d399; }
    .cost-tier.reasoning      { background: rgba(139,92,246,.15); color: #a78bfa; }
    .cost-tier.complex        { background: rgba(251,191,36,.14); color: #fbbf24; }
    .cost-tier.unmapped { background: rgba(120,120,140,.13); color: var(--muted-mid); }
    .cost-bar { height: 3px; background: var(--agent); border-radius: 2px; margin-top: 5px; opacity: .75; }
    .cost-note { font-size: 11px; color: var(--muted); margin-top: 18px; line-height: 1.6; max-width: 640px; }
    .cost-flag { color: #fbbf24; }

    /* ── Logs ── */
    #logs-view.active { flex-direction: row; }
    .logs-sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
    .logs-sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
      border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .log-item { padding: 9px 14px; font-size: 12px; color: var(--muted-mid); cursor: pointer; border-bottom: 1px solid var(--border); }
    .log-item:hover { background: var(--card-hover); }
    .log-item.active { background: rgba(99,102,241,.1); color: var(--text); }
    .log-item .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .logs-main { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .log-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.6;
      color: var(--muted-mid); white-space: pre-wrap; word-break: break-word; }

    /* ── Modal ── */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.68); z-index: 200;
      align-items: center; justify-content: center; backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border-light); border-radius: 12px;
      width: 640px; max-width: 94vw; max-height: 86vh; display: flex; flex-direction: column;
      box-shadow: 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }
    .modal-head { padding: 15px 20px 12px; border-bottom: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: flex-start; gap: 12px; flex-shrink: 0; }
    .modal-title { font-size: 15px; font-weight: 600; line-height: 1.35; }
    .modal-sub { font-size: 12px; color: var(--muted-mid); margin-top: 3px; line-height: 1.45; }
    .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 2px; line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px;
      padding: 13px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .meta-grid .k { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 2px; }
    .meta-grid .v { font-size: 12px; color: var(--text); line-height: 1.4; }
    .modal-body { padding: 14px 20px 18px; overflow-y: auto; font-size: 12.5px; line-height: 1.65; color: var(--muted-mid); }
    .modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;
      gap: 8px; flex-shrink: 0; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-field label { display: block; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
    .form-field input, .form-field textarea { width: 100%; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">⚙</div>
    <div class="header-title">Business OS <span>/ Control Center</span></div>
  </div>
  <div class="header-right">
    <div class="live-pill"><div class="live-dot"></div><span>live</span></div>
    <div class="header-date" id="date-display"></div>
    <div class="header-date" id="user-email"></div>
    <button class="btn" onclick="logout()">Log out</button>
  </div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" id="tab-marketing" onclick="switchTab('marketing')">Marketing</button>
  <button class="tab-btn" id="tab-sales" onclick="switchTab('sales')">Sales</button>
  <button class="tab-btn" id="tab-eng" onclick="switchTab('eng')">Engineering</button>
  <button class="tab-btn" id="tab-cost" onclick="switchTab('cost')">Cost</button>
  <button class="tab-btn" id="tab-logs" onclick="switchTab('logs')">Logs</button>
</div>

<!-- ── Marketing ── -->
<div class="view active" id="marketing-view">
  <div class="toolbar">
    <select class="instance-select" id="mkt-instance" onchange="setMktInstance(this.value)"
            title="Which business's marketing department"></select>
    <!-- Channel is the marketing analogue of the Engineering tab's instance

<script>
// A session that expired (or a server that restarted, dropping the in-memory
// session store) shows up as a 401 on whatever tab happens to poll next —
// catching it here, once, beats teaching every fetch() call site below it.
const _fetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const r = await _fetch(...args);
  if (r.status === 401) { window.location.href = '/login'; }
  return r;
};

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

fetch('/api/auth/me').then(r => r.json()).then(d => {
  if (d && d.email) document.getElementById('user-email').textContent = d.email;
}).catch(() => {});

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtDur(sec) {
  if (sec == null) return '';
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec}s`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m`;
  const hr = Math.floor(min / 60);
  const remMin = min % 60;
  return `${hr}h${remMin ? ' ' + remMin + 'm' : ''}`;
}
function shortCtx(context) {
  if (!context) return '';
  return context.split(/[\\/]/).pop().replace(/\.md$/, '');
}
// Event type -> plain-English verb. There is no separate tracked "phase"
// (architect / building / testing / security) — one Claude session does all
// of that within a single pass, guided by the ticket's own state rather than
// a labelled hand-off — so the event type plus the live transcript snippet
// below it is the honest readout, not an invented stage label.
const EVENT_VERBS = {
  continue: 'Building', decision: 'Applying decision', intake: 'Shaping request',
  scheduled: 'Running sweep', watch: 'Checking inbox', finding: 'Handling finding',
};
function eventVerb(a) {
  const raw = a.current_event || '';
  const head = raw.split(/\s/)[0];
  return EVENT_VERBS[head] || 'Working';
}
function eventLabel(a) {
  const verb = eventVerb(a);
  if (a.current_ticket) return `${verb} ${a.current_ticket}`;
  const raw = a.current_event || '';
  const ctxMatch = raw.match(/\(([^)]+)\)/);
  if (ctxMatch) return `${verb} — ${shortCtx(ctxMatch[1])}`;
  return raw ? verb : 'Working — a pass';
}
function renderActivity(a) {
  if (!a) return '';
  const dotClass = a.running ? 'dot-on' : 'dot-off';
  const statusText = a.running ? eventLabel(a) : 'Idle';
  const bits = [];
  if (a.running && a.running_seconds != null) bits.push(`session active ${fmtDur(a.running_seconds)}`);
  bits.push(`today ${a.hops_today}${a.hops_budget ? '/' + a.hops_budget : ''} hops`);
  if (a.refunds_today) bits.push(`${a.refunds_today} refunded`);
  bits.push(`${a.pending_count} queued`);

  let h = '<div class="section"><div class="h">Right now</div><div class="card activity">';
  h += `<div class="row"><span class="status-dot ${dotClass}"></span><span class="title">${statusText}</span></div>`;
  h += `<div class="meta">${esc(bits.join(' · '))}</div>`;
  if (a.running && a.current_activity) {
    h += `<div class="now-line">${esc(a.current_activity)}</div>`;
  }

  if (a.mode_halting) {
    h += `<div class="meta warn">MODE=${esc(a.mode)} — this instance goes silent; nothing here will notify or post until it's cleared.</div>`;
  }
  if (a.backoff_active) {
    h += `<div class="meta warn">Backed off after repeated failed starts — next attempt in ~${fmtDur(a.backoff_seconds)}.</div>`;
  }

  if (a.pending_preview && a.pending_preview.length) {
    const label = a.pending_count > a.pending_preview.length
      ? `Up next (${a.pending_preview.length} of ${a.pending_count})` : `Up next (${a.pending_count})`;
    h += `<details class="activity-detail"><summary>${esc(label)}</summary><div class="queue-list">`;
    a.pending_preview.forEach(p => {
      h += `<div class="queue-row"><span class="tag stage">${esc(p.event)}</span> ${esc(shortCtx(p.context))}</div>`;
    });
    h += '</div></details>';
  }

  if (a.recent_log && a.recent_log.length) {
    h += '<details class="activity-detail"><summary>Recent activity</summary>' +
      `<pre class="log-tail">${esc(a.recent_log.join('\n'))}</pre></details>`;
  }

  h += '</div></div>';
  return h;
}
function relTime(iso) {
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms) || ms < 0) return '';
  const min = Math.round(ms / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const hr = Math.round(min / 60);
  if (hr < 24) return `${hr}h ago`;
  return `${Math.round(hr / 24)}d ago`;
}
function renderMarkdown(text) {
  return esc(text)
    .replace(/^\s*#{1,2}\s+(.*)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>')
    .replace(/<br>(<h2>)/g, '$1')
    .replace(/(<\/h2>)<br>/g, '$1');
}
function reflowHardWraps(text) {
  const lines = String(text == null ? '' : text).split('\n');
  const out = [];
  for (const line of lines) {
    const t = line.trim();
    const startsNew = out.length === 0 || t === '' ||
      /^#{1,2}\s/.test(t) || /^(\d+\.|[-*])\s/.test(t);
    if (startsNew) { out.push(line); continue; }
    const prevT = out[out.length - 1].trim();
    if (prevT === '' || /^#{1,2}\s/.test(prevT)) out.push(line);
    else out[out.length - 1] = out[out.length - 1].replace(/\s+$/, '') + ' ' + t;
  }
  return out.join('\n');
}
function renderDecisionBody(text) { return renderMarkdown(reflowHardWraps(text)); }

// One or more PR links for a merge-gate decision card. Single-repo tickets
// get a plain "Open the PR →"; multi-repo tickets get one link per repo so
// each can be opened and merged on GitHub directly from here.
function renderPrLinks(links) {
  if (!links || !links.length) return '';
  const items = links.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener" style="color:#60a5fa">` +
    `${l.repo ? esc(l.repo) + ' PR' : 'Open the PR'} →</a>`);
  return `<div class="meta">${items.join(' &nbsp;·&nbsp; ')}</div>`;
}

function updateDate() {
  document.getElementById('date-display').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
updateDate();
setInterval(updateDate, 60000);

let activeTab = 'marketing';
function switchTab(tab) {
  activeTab = tab;
  ['marketing', 'sales', 'eng', 'cost', 'logs'].forEach(t =>
    document.getElementById('tab-' + t).classList.toggle('active', tab === t));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(tab + '-view').classList.add('active');
  if (tab === 'marketing') loadMarketing();
  if (tab === 'sales') loadSales();
  if (tab === 'eng') loadEng();
  if (tab === 'cost') loadCost();
  if (tab === 'logs') loadLogList();
  if (tab === 'eng') startEngPoll(); else stopEngPoll();
}

// ══════════════════════════════════════════════════════════════════════════
// Marketing — the marketing department, per business instance
// ══════════════════════════════════════════════════════════════════════════
// Four views under one tab. DECIDE is the department's M2 gate and the only
// recurring human step in the whole system, so it shows what is actually due
// and nothing else. CONTENT is the library. REDDIT is the Twenty CRM pipeline,
// folded in here because it is one channel rather than the department.
// SETTINGS is the channel config — configuration, separated from work.

let mktView = 'decide';
let mktData = null;
let contentItems = [];
let contentFilter = '';
// Remembered across visits. Re-picking on every open is the recurring manual
// step this system exists to remove, and the Engineering tab's instance
// selector already set that precedent.
let mktInstance = localStorage.getItem('mkt-instance') || '';
let mktChannel = localStorage.getItem('mkt-channel') || '';

const MKT_PHASE_LABEL = {
  drafting: 'drafting', awaiting: 'awaiting your approval',
  queued: 'approved, waiting to ship', shipped: 'shipped',
};

function setMktInstance(id) {
  mktInstance = id;
  localStorage.setItem('mkt-instance', id);
  // Every view is scoped to the instance, so all of them are now stale.
  contentItems = []; settingsData = null;
  mktRefresh();
}

function setMktChannel(id) {
  mktChannel = id;
  localStorage.setItem('mkt-channel', id);
  if (mktData) renderMarketing();
  if (contentItems.length) renderContent();
  // The dropdown scopes the whole tab, settings included — picking one channel
  // and reading another's cadence underneath it is the mismatch this filter
  // exists to prevent.
  if (settingsData) renderSettings();
}

function inChannel(x) { return !mktChannel || x.channel === mktChannel; }

function setMktView(v) {
  mktView = v;
  document.querySelectorAll('[data-mview]').forEach(b =>
    b.classList.toggle('active', b.dataset.mview === v));
  document.getElementById('mkt-scroll').style.display = v === 'decide' ? '' : 'none';
  document.getElementById('content-scroll').style.display = v === 'content' ? '' : 'none';
  document.getElementById('reddit-scroll').style.display = v === 'reddit' ? '' : 'none';
  document.getElementById('settings-scroll').style.display = v === 'settings' ? '' : 'none';
  document.getElementById('mkt-phase-filters').style.display = v === 'content' ? 'contents' : 'none';
  document.getElementById('mkt-reddit-filters').style.display = v === 'reddit' ? 'contents' : 'none';
  // The channel dropdown scopes the department's own views. Reddit's records
  // live in Twenty and carry no department channel, so it would filter them
  // all away — hide it there rather than leave a control that empties the view.
  document.getElementById('mkt-channel').style.display = v === 'reddit' ? 'none' : '';
  if (v === 'decide' && mktData) renderMarketing();
  // Loaded on first visit rather than with the tab: these are the views opened
  // least often, and reading the library or the config on every Marketing open
  // would be work nobody asked for.
  if (v === 'content') { contentItems.length ? renderContent() : loadContent(); }
  if (v === 'reddit') { redditItems.length ? renderReddit() : loadReddit(); }
  if (v === 'settings') { settingsData ? renderSettings() : loadSettings(); }
}

// One refresh button, four views. Refreshing settings by reloading the library
// would look identical and do nothing.
function mktRefresh() {
  if (mktView === 'settings') loadSettings();
  else if (mktView === 'content') loadContent();
  else if (mktView === 'reddit') loadReddit();
  else loadMarketing();
}

function mktQ(extra) {
  const p = new URLSearchParams();
  if (mktInstance) p.set('instance', mktInstance);
  Object.entries(extra || {}).forEach(([k, v]) => { if (v) p.set(k, v); });
  const q = p.toString();
  return q ? '?' + q : '';
}

function renderMktInstances(list) {
  const sel = document.getElementById('mkt-instance');
  sel.innerHTML = (list || []).map(i =>
    `<option value="${escAttr(i.id)}"${i.id === mktInstance ? ' selected' : ''}>${esc(i.label)}</option>`
  ).join('');
  sel.style.display = (list || []).length > 1 ? '' : 'none';
}

function renderMktChannels(list) {
  const sel = document.getElementById('mkt-channel');
  const opts = ['<option value="">All channels</option>'].concat((list || []).map(c =>
    `<option value="${escAttr(c.id)}"${c.id === mktChannel ? ' selected' : ''}>` +
    `${esc(c.label)}${c.enabled ? '' : ' (off)'}</option>`));
  sel.innerHTML = opts.join('');
  // A channel since removed from config must not strand the tab on a filter
  // that matches nothing forever.
  if (mktChannel && !(list || []).some(c => c.id === mktChannel)) setMktChannel('');
}

async function loadMarketing() {
  const el = document.getElementById('mkt-scroll');
  try {
    const r = await fetch('/api/marketing' + mktQ());
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    mktData = d;
    mktInstance = d.instance || '';
    renderMktInstances(d.instances);
    renderMktChannels(d.channels);
    renderMarketing();
  } catch (e) {
    el.innerHTML = `<div class="empty">Error loading marketing: ${esc(String(e))}</div>`;
  }
}

function mktPieceCard(p, opts) {
  opts = opts || {};
  const chan = (mktData && (mktData.channels || []).find(c => c.id === p.channel));
  const tags = [];
  if (p.channel) tags.push(`<span class="tag">${esc(chan ? chan.label : p.channel)}</span>`);
  if (p.archetype) tags.push(`<span class="tag">${esc(p.archetype)}</span>`);
  if (p.has_carousel) tags.push('<span class="tag">carousel</span>');
  else if (p.format) tags.push(`<span class="tag">${esc(p.format)}</span>`);
  if (p.series_stage) tags.push(`<span class="tag">stage ${esc(p.series_stage)}</span>`);
  if (opts.gate) tags.push('<span class="tag gate">M2</span>');
  return '<div class="card' + (opts.gate ? ' accent' : '') + '">' +
    `<div class="row"><span class="title">${esc(p.title)}</span>${tags.join('')}</div>` +
    `<div class="meta">${p.date ? 'planned ' + esc(p.date) : 'no planned date'}` +
    (opts.meta ? ' · ' + esc(opts.meta) : '') + '</div>' +
    // Full body, never truncated. Someone is approving this text; a cut-off
    // preview is the difference between reading a piece and glancing at one.
    (opts.body ? `<div class="body-text">${esc(p.body) || '—'}</div>` : '') +
    (opts.actions || '') + '</div>';
}

function renderMarketing() {
  const el = document.getElementById('mkt-scroll');
  const d = mktData;
  if (d.empty) { el.innerHTML = `<div class="empty">${esc(d.empty)}</div>`; return; }
  const due = d.due.filter(inChannel);
  const queued = d.queued.filter(inChannel);
  // The stats strip counts what the dropdown is showing. A header that keeps
  // reporting every channel while the body shows one is the kind of quiet
  // mismatch that makes a dashboard untrustworthy.
  const chan = mktChannel ? (d.channels.find(c => c.id === mktChannel) || null) : null;
  let h = '';

  h += '<div class="stats">' +
    `<div class="stat${due.length ? ' over' : ''}"><b>${due.length}</b>due for approval</div>` +
    `<div class="stat"><b>${queued.length}</b>approved, waiting to ship</div>` +
    (chan
      ? `<div class="stat"><b>${esc(chan.next_slot || '—')}</b>next ${esc(chan.label)} slot</div>`
      : `<div class="stat"><b>${d.stats.shipped_30d}</b>shipped in 30 days</div>` +
        `<div class="stat"><b>${d.stats.channels_live}</b>channels live</div>`) +
    '</div>';

  h += '<div class="section"><div class="h">Due for your approval ' +
       `<span class="count">${due.length}</span></div>`;
  if (!due.length) {
    h += '<div class="card"><div class="body-text">Nothing needs you' +
         (mktChannel ? ' on this channel' : '') + '. Anything else written is ' +
         'dated further out — approve those when they come due, not now.</div></div>';
  }
  due.forEach(p => {
    const actions = '<div class="actions">' +
      `<button class="btn yes" onclick="mktApprove('${escAttr(p.path)}')">Approve</button>` +
      `<button class="btn" onclick="mktOpenInContent('${escAttr(p.path)}')">Open in Content</button>` +
      '</div>';
    h += mktPieceCard(p, {
      gate: true, body: true, actions,
      meta: 'nothing publishes without this',
    });
  });
  // Deliberately a sentence, not a list. These are written, dated, and not
  // anyone's problem yet; the point of the window is that they stay that way.
  // Only shown unfiltered — the count is across all channels, and captioning
  // it with one channel's name would be a small lie.
  if (!mktChannel && d.later_count) {
    h += `<div class="quiet">${d.later_count} more written and dated beyond the ` +
         `next ${d.window_days} days` +
         (d.later_first ? `, starting ${esc(d.later_first)}` : '') +
         '. They are under Content when you want them.</div>';
  }
  h += '</div>';

  if (queued.length) {
    h += '<div class="section"><div class="h">Approved, shipping itself ' +
         `<span class="count">${queued.length}</span></div>`;
    queued.slice(0, 6).forEach(p => {
      h += mktPieceCard(p, { meta: "goes out on its channel's next slot" });
    });
    h += '</div>';
  }

  h += '<div class="section"><div class="h">Give the department something to write</div>' +
    '<div class="intake-box">' +
    '<input id="mkt-topic" placeholder="A topic worth a piece" />' +
    '<textarea id="mkt-topic-note" rows="2" placeholder="Why it fits, or the real story behind it (optional)"></textarea>' +
    '<div class="row"><button class="btn yes" onclick="mktAddTopic()">Add to the topic bank</button>' +
    '<span class="note-text" id="mkt-topic-out">The CMO reads the bank on its next ' +
    "planning run and picks the archetype — you don't have to classify it.</span></div>" +
    '</div></div>';

  el.innerHTML = h;
}

async function mktApprove(path) {
  const r = await fetch('/api/mkt/approve', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, instance: mktInstance }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { alert(d.error || 'Approve failed'); return; }
  contentItems = [];   // the piece moved folders; the library is stale
  loadMarketing();
}

async function mktOpenInContent(path) {
  // Decide shows what needs deciding; Content shows everything. Both are views
  // of the same tab, so this is a view switch rather than a tab switch.
  setMktView('content');
  if (!contentItems.length) { try { await loadContent(); } catch (e) { /* the view shows its own error */ } }
  const el = document.getElementById('piece-' + cssId(path));
  if (el) el.scrollIntoView({ block: 'center' });
}

async function mktAddTopic() {
  const t = document.getElementById('mkt-topic');
  const n = document.getElementById('mkt-topic-note');
  const out = document.getElementById('mkt-topic-out');
  if (!t.value.trim()) { t.focus(); return; }
  const r = await fetch('/api/mkt/topic', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic: t.value, note: n.value, instance: mktInstance }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.error || 'Failed'); return; }
  t.value = ''; n.value = '';
  out.textContent = 'In the bank. The CMO picks it up on its next planning run — ' +
    'nothing else for you to do with it.';
}

// ── Settings — the channel config ─────────────────────────────────────────
// Everything here was previously a hand edit to a YAML file, which is exactly
// the recurring manual step this system exists to remove. Sections, not a flat
// channel list: channels are the only section today and will not be the last.

let settingsData = null;

async function loadSettings() {
  const el = document.getElementById('settings-scroll');
  try {
    const r = await fetch('/api/settings' + mktQ());
    if (!r.ok) {
      el.innerHTML = '<div class="empty">' + (r.status === 404
        ? 'This view needs a server restart — the running process predates /api/settings.'
        : 'Error loading settings (' + r.status + ').') + '</div>';
      return;
    }
    settingsData = await r.json();
    if (settingsData.empty) { el.innerHTML = `<div class="empty">${esc(settingsData.empty)}</div>`; return; }
    renderSettings();
  } catch (e) {
    el.innerHTML = '<div class="empty">Error loading settings.</div>';
  }
}

function renderSettings() {
  const el = document.getElementById('settings-scroll');
  let h = '';
  (settingsData.sections || []).forEach(sec => {
    if (sec.id !== 'channels') return;   // the only renderer that exists yet
    // Keyed on `id`, not `channel` — a settings row IS a channel rather than a
    // piece that belongs to one, so inChannel() is the wrong shape here.
    const shown = (sec.channels || []).filter(c => !mktChannel || c.id === mktChannel);
    h += '<div class="section">' +
      `<div class="h">${esc(sec.label)}</div>` +
      `<div class="note-text">${esc(sec.note)}</div>` +
      `<div class="set-src">${esc(sec.source)}</div>`;
    if (!shown.length) {
      h += '<div class="empty">' + (sec.channels.length
        ? 'No settings for this channel.' : 'No channels configured.') + '</div>';
    }
    shown.forEach(c => h += settingsChannelCard(c, sec.weekdays));
    h += '</div>';
  });
  el.innerHTML = h;
}

function settingsChannelCard(c, weekdays) {
  const id = escAttr(c.id);
  const days = c.publishing_days || [];
  const can = f => (c.editable || []).includes(f);

  // Cadence renders one of two ways, and which one is a fact about the channel
  // rather than a presentation choice.
  //
  //   config   — publishing_days IS the schedule. The ship skill reads this
  //              list every run and stops on any day not in it, so these
  //              buttons change what actually publishes.
  //   schedule — the ship routine's own cron decides and this config has no day
  //              list to read. Read-only, because a day list written here would
  //              be a setting nobody reads — and the server would refuse the
  //              write anyway, so the buttons would only ever produce an error.
  const cadence = c.cadence_source === 'config'
    ? '<label>Publishing days</label><div>' +
        '<div class="set-days">' +
        weekdays.map(d =>
          `<button class="set-day${days.includes(d) ? ' on' : ''}" ` +
          `onclick="toggleChannelDay('${id}','${d}')">${d.slice(0, 3)}</button>`).join('') +
        '</div></div>' +
      '<label>Publishing time</label><div>' +
        `<input class="set-in" value="${esc(c.publishing_time)}" placeholder="HH:MM" ` +
        `onchange="setChannelField('${id}','publishing_time',this.value)" />` +
        `<span class="meta">${c.next_slot ? ' next: ' + esc(c.next_slot) : ''}</span></div>`
    : '<label>Cadence</label>' +
      `<div class="set-locked">${esc(c.schedule_human || 'set by its ship routine, not by this config')}` +
      `${c.next_slot ? ' · next: ' + esc(c.next_slot) : ''}` +
      '<div class="meta">Not set here — this channel has no day list in the marketing ' +
      'config, and its ship routine would not read one. ' +
      `${c.schedule_file ? 'Changing it is an edit to <code>' + esc(c.schedule_file) + '</code>. ' : ''}` +
      'Which piece goes out on a given day is its own planned date, oldest first, one a day.</div></div>';

  return '<div class="card">' +
    '<div class="chan-h">' +
      `<span class="chan-name">${esc(c.label)}</span>` +
      `<span class="tier ${esc(c.tier.toLowerCase())}">${esc(c.tier)}</span>` +
      `<span class="set-saved" id="set-msg-${id}"></span>` +
    '</div>' +
    `<div class="meta">${esc(c.tier_why)}</div>` +
    '<div class="set-row">' +
      '<label>Channel</label><div>' +
        (can('enabled')
          ? `<button class="set-toggle${c.enabled ? ' on' : ''}" ` +
            `onclick="setChannelField('${id}','enabled',${c.enabled ? 'false' : 'true'})">` +
            `${c.enabled ? 'On' : 'Off'}</button>`
          : `<span class="set-locked">${c.enabled ? 'On' : 'Off'}</span>`) + '</div>' +
      '<label>Pieces per week</label><div>' +
        (can('post_count')
          ? `<input class="set-in" type="number" min="0" max="50" value="${esc(c.post_count)}" ` +
            `onchange="setChannelField('${id}','post_count',this.value)" />`
          : `<span class="set-locked">${esc(c.post_count)}</span>`) +
        // A paused channel's 0 is a decision with a reason, not a blank. Saying
        // so stops the number reading as something to "fix".
        (c.paused_for && String(c.post_count) === '0'
          ? '<span class="meta"> paused — see below</span>' : '') + '</div>' +
      cadence +
      '<label>Publishes via</label>' +
      `<div class="set-locked">${esc(c.publish_path)}</div>` +
      '<label>Per-piece approval</label>' +
      // Deliberately not a toggle. Turning this off means content publishes
      // with nobody reading it first — that belongs in the config file where it
      // takes a deliberate edit, not one click here. The friction is the point.
      `<div class="set-locked"><b>${c.require_approval ? 'Required' : 'NOT REQUIRED'}</b>` +
      ' — changing this is an edit to the config file, on purpose</div>' +
      '<label>Voice corpus</label>' +
      `<div class="set-locked">${esc(c.voice_have)}/${esc(c.voice_need)} samples` +
      (Number(c.voice_have) < Number(c.voice_need) ? ' · below the floor' : '') + '</div>' +
      (c.paused_for ? '<label>Paused</label>' +
        `<div class="set-locked">for <b>${esc(c.paused_for)}</b></div>` : '') +
      (c.playbook ? '<label>Playbook</label>' +
        `<div class="set-locked">${esc(c.playbook)}</div>` : '') +
    '</div></div>';
}

// One write at a time. Every day button computes the NEW list from the
// currently-rendered one, and that list is only refreshed after the server
// round-trip — so two quick clicks would both read the same pre-write state and
// the second would recompute the first's change away. Ignoring a click
// mid-write is the honest behaviour: the alternative is a click that appears to
// register and silently does not, on the config that decides what publishes.
let settingsBusy = false;

async function toggleChannelDay(channel, day) {
  if (settingsBusy) return;
  const sec = (settingsData.sections || []).find(x => x.id === 'channels');
  const c = sec && sec.channels.find(x => x.id === channel);
  if (!c) return;
  const days = (c.publishing_days || []).slice();
  const i = days.indexOf(day);
  if (i >= 0) days.splice(i, 1); else days.push(day);
  await setChannelField(channel, 'publishing_days', days);
}

async function setChannelField(channel, field, value) {
  if (settingsBusy) return;
  settingsBusy = true;
  const msg = document.getElementById('set-msg-' + channel);
  if (msg) { msg.className = 'set-saved'; msg.textContent = 'saving…'; }
  try {
    const r = await fetch('/api/settings/channel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channel, field, value, instance: mktInstance }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      // The server refuses rather than writing a config it could not verify, so
      // a rejection means nothing changed on disk. Say what was wrong and leave
      // the UI showing the real, unchanged state.
      if (msg) { msg.className = 'set-err'; msg.textContent = j.error || 'not saved'; }
    } else if (msg) {
      msg.className = 'set-saved'; msg.textContent = 'saved';
    }
  } catch (e) {
    if (msg) { msg.className = 'set-err'; msg.textContent = 'not saved: ' + e.message; }
  } finally {
    // Re-read rather than patching local state. The file is the truth, the
    // server normalises what it writes (days come back Monday-first), and
    // showing anything else would make the view disagree with what actually
    // runs. It happens on the refusal path too — a rejection is exactly when
    // the on-screen state most needs to be the file's.
    await loadSettings();
    // Cadence changed under the Decide view's feet — its next-slot line and
    // channel list are now stale.
    if (mktData) loadMarketing();
    // Released only after the redraw, so the next click computes its day list
    // from what the file now says rather than from the list it just replaced.
    settingsBusy = false;
  }
}

// Sales — generic CRM funnel, per business instance
// ══════════════════════════════════════════════════════════════════════════
const PIPE_LABELS = {
  '1-signal': 'Signal', '2-qualified': 'Qualified', '3-contacted': 'Contacted',
  '4-engaged': 'Engaged', '5-proposal-sent': 'Proposal sent',
  '6-negotiating': 'Negotiating', '7-closed/won': 'Won', '7-closed/lost': 'Lost',
};
let salesData = null;
let salesInstance = localStorage.getItem('sales-instance') || '';

async function loadSales() {
  const el = document.getElementById('sales-scroll');
  try {
    const q = salesInstance ? '?instance=' + encodeURIComponent(salesInstance) : '';
    const r = await fetch('/api/sales' + q);
    salesData = await r.json();
    salesInstance = salesData.instance || '';
    localStorage.setItem('sales-instance', salesInstance);
    renderSalesInstances();
    renderSales();

  }
}

function renderSalesInstances() {
  const sel = document.getElementById('sales-instance');
  const list = (salesData && salesData.instances) || [];
  sel.style.display = list.length > 1 ? '' : 'none';
  sel.innerHTML = list.map(i =>
    `<option value="${escAttr(i.id)}"${i.id === salesInstance ? ' selected' : ''}>${esc(i.label)}</option>`).join('');
}

function setSalesInstance(id) {
  salesInstance = id;
  localStorage.setItem('sales-instance', id);
  salesData = null;
  document.getElementById('sales-scroll').innerHTML = '<div class="empty">Loading…</div>';
  loadSales();
}

function leadCardTitle(l) {
  const contact = (l.contact || '').trim();
  const name = contact.split(/\s+[—–-]{1,2}\s+/)[0].trim();
  if (name) return name;
  return companyShort(l) || l.slug;
}
function companyShort(l) {
  const co = (l.company || '').split(' (')[0].trim();
  return co;
}

function renderSales() {
  const el = document.getElementById('sales-scroll');
  const d = salesData;
  if (d.empty) { el.innerHTML = `<div class="empty">${esc(d.empty)}</div>`; return; }
  const stages = d.stages || [];
  const openStages = stages.filter(s => !s.name.startsWith('7-'));
  const activeCount = openStages.reduce((n, s) => n + s.leads.length, 0);

  const totals = `<div class="totals">
    <span><span class="n">${activeCount}</span> <span class="l">active leads</span></span>
    <span><span class="n">$${(d.total_value || 0).toLocaleString()}</span> <span class="l">pipeline value</span></span>
  </div>`;

  const cols = `<div class="cols">${stages.map(s => `
    <div class="col" ondragover="pipeDragOver(event, this)" ondragleave="pipeDragLeave(event, this)"
         ondrop="pipeDrop(event, this, '${s.name}')">
      <div class="col-head">
        <span class="col-name">${PIPE_LABELS[s.name] || esc(s.name)}</span>
        <span class="col-count">${s.leads.length}</span>
      </div>
      ${s.leads.length ? s.leads.map(l => `<div class="lead-card" draggable="true"
        ondragstart="pipeDragStart(event, this, '${l.slug.replace(/'/g, "\\'")}')"
        ondragend="pipeDragEnd(event, this)"
        onclick="openLeadModal('${s.name}','${l.slug.replace(/'/g, "\\'")}')">
        <div class="lead-who">${esc(leadCardTitle(l))}</div>
        ${companyShort(l) && companyShort(l) !== leadCardTitle(l) ? `<div class="lead-co">${esc(companyShort(l))}</div>` : ''}
        ${l.status_note ? `<div class="lead-note">${esc(l.status_note)}</div>` : ''}
        <div class="lead-meta">
          ${l.source ? `<span class="chip">${esc(l.source)}</span>` : ''}
          ${l.value ? `<span class="chip">$${l.value.toLocaleString()}</span>` : ''}
          ${l.days_since_touch != null && l.days_since_touch >= 7 && !s.name.startsWith('7-')
            ? `<span class="stale">${l.days_since_touch}d silent</span>` : ''}
          ${l.action_overdue ? '<span class="due-dot" title="next action due"></span>' : ''}
        </div>
      </div>`).join('') : '<div class="empty-col">—</div>'}
    </div>`).join('')}</div>`;

  el.innerHTML = totals + cols;
}

let pipeDrag = null;
function pipeDragStart(e, el, slug) {
  pipeDrag = slug;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', slug); } catch (err) {}
}
function pipeDragEnd(e, el) {
  el.classList.remove('dragging');
  document.querySelectorAll('.col.drag-over').forEach(c => c.classList.remove('drag-over'));
}
function pipeDragOver(e, col) {
  if (!pipeDrag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  col.classList.add('drag-over');
}
function pipeDragLeave(e, col) {
  if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
}
async function pipeDrop(e, col, stage) {
  e.preventDefault();
  col.classList.remove('drag-over');
  const slug = pipeDrag;
  pipeDrag = null;
  if (!slug) return;
  try {
    const r = await fetch('/api/sales/move-lead', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ instance: salesInstance, slug, to_stage: stage }),
    });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
  } catch (err) {
    alert('Move failed: ' + err.message);
  }
  loadSales();
}

let lmCurrent = null;
function openLeadModal(stageName, slug) {
  const stage = (salesData.stages || []).find(s => s.name === stageName);
  const l = stage && (stage.leads || []).find(x => x.slug === slug);
  if (!l) return;
  lmCurrent = { stageName, slug };

  document.getElementById('lm-contact').textContent = l.contact || l.slug;
  document.getElementById('lm-company').textContent = l.company || '';
  document.getElementById('lm-status-note').value = l.status_note || '';
  document.getElementById('lm-value').value = l.value || '';
  document.getElementById('lm-due').value = l.next_action_due || '';
  document.getElementById('lm-note').value = '';

  const meta = [
    ['Stage', PIPE_LABELS[stageName] || stageName],
    ['Source', l.source],
    ['Segment', l.icp_segment],
    ['Last touch', l.last_touch || (l.days_since_touch != null ? l.days_since_touch + 'd ago' : '')],
    ['Contract end', l.contract_end_date],
    ['Custom cadence', l.custom_cadence],
  ].filter(([, v]) => v);
  document.getElementById('lm-meta').innerHTML = meta.map(([k, v]) =>
    `<div><div class="k">${esc(k)}</div><div class="v">${esc(String(v))}</div></div>`).join('');

  document.getElementById('lm-body').innerHTML = l.body
    ? renderMarkdown(l.body) : '<span style="color:var(--muted)">No history recorded.</span>';
  document.getElementById('lead-modal').classList.add('open');
}
function closeLeadModal() { document.getElementById('lead-modal').classList.remove('open'); lmCurrent = null; }

async function saveLeadEdit() {
  if (!lmCurrent) return;
  const fields = {
    status_note: document.getElementById('lm-status-note').value,
    estimated_value: document.getElementById('lm-value').value,
    next_action_due: document.getElementById('lm-due').value,
  };
  const note = document.getElementById('lm-note').value;
  const r = await fetch('/api/sales/lead/update', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ instance: salesInstance, slug: lmCurrent.slug, fields, note }),
  });
  const d = await r.json();
  if (!r.ok) { alert(d.error || 'Failed'); return; }
  closeLeadModal();
  loadSales();
}

function openLeadAddModal() {

    document.getElementById(id).value = '');

function closeLeadAddModal() { document.getElementById('lead-add-modal').classList.remove('open'); }

async function submitLeadAdd() {
