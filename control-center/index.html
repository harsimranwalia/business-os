// ══════════════════════════════════════════════════════════════════════════
// Engineering — ported from life-os's control-center, re-rooted at this repo
// ══════════════════════════════════════════════════════════════════════════
let engData = null;
let engInstance = localStorage.getItem('eng-instance') || '';
let engView = 'decide';
let engShowDropped = localStorage.getItem('engShowDropped') === '1';
let engWaitingFilter = localStorage.getItem('engWaitingFilter') || 'all';
const ENG_WORKING_STATES = ['ready', 'building', 'in-review', 'in-qa', 'in-security', 'ready-to-ship'];
const ENG_POLL_MS = 10000;
let engPollTimer = null;

async function loadEng() {
  const el = document.getElementById('eng-scroll');
  try {
    const q = engInstance ? '?instance=' + encodeURIComponent(engInstance) : '';
    const r = await fetch('/api/engineering' + q);
    engData = await r.json();
    engInstance = engData.instance || '';
    localStorage.setItem('eng-instance', engInstance);
    renderEngInstances();
    renderEng();
  } catch (e) {
    el.innerHTML = '<div class="empty">Error loading engineering.</div>';
  }
}

// Live-ish refresh while the tab is open, so "Right now" stays current
// without a manual reload. Skips a tick rather than re-rendering out from
// under you if you're mid-note in a "Request changes" textarea — a full
// re-render replaces that element and would drop what you typed and your
// cursor focus with it.
function engPollTick() {
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('decide-note')) return;
  loadEng();
}
function startEngPoll() {
  if (engPollTimer) return;
  engPollTimer = setInterval(engPollTick, ENG_POLL_MS);
}
function stopEngPoll() {
  if (!engPollTimer) return;
  clearInterval(engPollTimer);
  engPollTimer = null;
}

function renderEngInstances() {
  const sel = document.getElementById('eng-instance');
  const list = (engData && engData.instances) || [];
  sel.style.display = list.length > 1 ? '' : 'none';
  sel.innerHTML = list.map(i =>
    `<option value="${escAttr(i.id)}"${i.id === engInstance ? ' selected' : ''}>${esc(i.label)}</option>`).join('');
}

function setEngInstance(id) {
  engInstance = id;
  localStorage.setItem('eng-instance', id);
  engData = null;
  document.getElementById('eng-scroll').innerHTML = '<div class="empty">Loading…</div>';
  loadEng();
}

function setEngView(v) {
  engView = v;
  document.querySelectorAll('[data-eview]').forEach(b => b.classList.toggle('active', b.dataset.eview === v));
  if (engData) renderEng();
}

function engToggleDropped() {
  engShowDropped = !engShowDropped;
  localStorage.setItem('engShowDropped', engShowDropped ? '1' : '0');
  renderEng();
}

function engSetWaitingFilter(v) {
  engWaitingFilter = v;
  localStorage.setItem('engWaitingFilter', v);
  renderEng();
}

function renderEng() {
  const el = document.getElementById('eng-scroll');
  const d = engData;
  if (!d.instance) {
    el.innerHTML = `<div class="empty">${esc(d.empty || 'No engineering instance yet.')}</div>`;
    return;
  }
  const s = d.stats;
  let h = '';

  h += '<div class="stats">' +
    `<div class="stat"><b>${s.waiting_on_harry}</b>waiting on you</div>` +
    `<div class="stat"><b>${s.in_flight}/${s.machine_limit}</b>in flight</div>` +
    `<div class="stat"><b>${s.pending_apply}</b>pending apply</div>` +
    `<div class="stat"><b>${s.open_bugs}</b>open bugs</div>` +
    `<div class="stat"><b>${s.shipped_recent}</b>verified</div>` +
    '</div>';

  h += renderActivity(d.activity);

  if (engView === 'decide') {
    const blocked = d.blocked_on_harry || [];
    const waitingTotal = d.waiting.length + blocked.length;
    h += '<div class="section"><div class="h">Waiting on you ' +
         `<span class="count">${waitingTotal}</span></div>`;
    if (waitingTotal) {
      const filt = (v, label) =>
        `<button class="prio-btn${engWaitingFilter === v ? ' on' : ''}" onclick="engSetWaitingFilter('${v}')">${label}</button>`;
      h += '<div class="prio-row" style="margin-bottom:8px">' +
        filt('all', 'all') + filt('merge', 'merge') + filt('scope', 'scope') + '</div>';
    }
    // Only "all" surfaces blocked-on-approver tickets — they carry no gate
    // of their own (a risk acceptance, a direct question; see blocked_on_harry
    // above), so neither the "merge" nor "scope" filter can honestly claim them.
    const showBlocked = engWaitingFilter === 'all';
    const waitingShown = d.waiting.filter(w => engWaitingFilter === 'all' || w.gate === engWaitingFilter);
    if (!waitingShown.length && !(showBlocked && blocked.length)) {
      h += '<div class="card"><div class="body-text">' +
        (waitingTotal ? 'Nothing waiting on you matches this filter.'
                      : "Nothing needs you. The department is either working or idle — both are fine.") +
        '</div></div>';
    }
    (showBlocked ? blocked : []).forEach(t => {
      h += '<div class="card">' +
        '<div class="row">' +
          '<span class="tag gate">blocked on you</span>' +
          `<span class="title">${esc(t.id)} — ${esc(t.title)}</span>` +
          (t.project ? `<span class="tag">${esc(t.project)}</span>` : '') +
        '</div>' +
        `<div class="meta">since ${esc(relTime(t.updated))} · see the ticket for what's needed` +
        (t.pr_url ? ` · <a href="${esc(t.pr_url)}" target="_blank" style="color:#60a5fa">Open the PR →</a>` : '') +
        '</div></div>';
    });
    waitingShown.forEach((w, i) => {
      const noteId = `eng-decide-note-${i}`;
      h += '<div class="card accent">' +
        '<div class="row">' +
          `<span class="tag gate">${esc(w.gate || 'decision')}</span>` +
          `<span class="title">${esc(w.ticket)}</span>` +
          (w.project ? `<span class="tag">${esc(w.project)}</span>` : '') +
          (w.time_estimate ? `<span class="tag">est. ${esc(w.time_estimate)}</span>` : '') +
          (w.time_impact ? `<span class="tag time-impact">+${esc(w.time_impact)}</span>` : '') +
        '</div>' +
        (w.recommendation ? `<div class="meta">Recommendation: <b>${esc(w.recommendation)}</b></div>` : '') +
        `<div class="body-text">${renderDecisionBody(w.body)}</div>` +
        renderPrLinks(w.pr_links) +
        `<textarea id="${noteId}" class="decide-note" rows="2" placeholder="Optional note — required if you're asking for changes"></textarea>` +
        '<div class="actions">' +
          `<button class="btn yes" onclick="engDecide('${escAttr(w.file)}','approved','${noteId}')">Approve</button>` +
          `<button class="btn edit" onclick="engDecide('${escAttr(w.file)}','changed','${noteId}')">Request changes</button>` +
          `<button class="btn no" onclick="engDecide('${escAttr(w.file)}','rejected','${noteId}')">Reject</button>` +
        '</div></div>';
    });
    h += '</div>';

    if (d.deciding && d.deciding.length) {
      const a = d.activity;
      // Honest, not optimistic: a decision is recorded the instant you answer
      // it, whether or not the trigger that's supposed to act on it actually
      // fired — a bare "the department is acting on it now" was true only by
      // accident (see the WSL bug that motivated this). Say what's actually
      // observed instead.
      const activityNote = a && a.running
        ? `the department is working on it now (${esc(a.current_event || 'a pass')})`
        : (a && a.pending_count > 0
            ? `queued — ${a.pending_count} item${a.pending_count === 1 ? '' : 's'} ahead of it, nothing running right now`
            : 'nothing is running and nothing is queued — if this sits here, the trigger may not have fired; check "Right now" above');
      h += '<div class="section"><div class="h">Applying your answer ' +
           `<span class="count">${d.deciding.length}</span></div>`;
      d.deciding.forEach(w => {
        h += '<div class="card">' +
          '<div class="row">' +
            `<span class="tag gate">${esc(w.gate || 'decision')}</span>` +
            `<span class="title">${esc(w.ticket)}</span>` +
            (w.project ? `<span class="tag">${esc(w.project)}</span>` : '') +
          '</div>' +
          `<div class="meta">you said <b>${esc(w.decision)}</b> ${esc(relTime(w.decided))} · ${activityNote}</div>` +
          renderPrLinks(w.pr_links) +
          (w.body ? '<details class="activity-detail"><summary>Show what you approved</summary>' +
            `<div class="body-text">${renderDecisionBody(w.body)}</div></details>` : '') +
          '</div>';
      });
      h += '</div>';
    }

    if (d.submitted && d.submitted.length) {
      h += '<div class="section"><div class="h">Waiting to be shaped ' +
           `<span class="count">${d.submitted.length}</span></div>`;
      d.submitted.forEach(s2 => {
        const filed = s2.origin === 'filed';
        const via = filed ? 'filed' + (s2.source ? ` by ${esc(s2.source)}` : '') : 'sent from here';
        h += '<div class="card">' +
          `<div class="title">${esc(s2.title)}</div>` +
          `<div class="meta">${via}` + (s2.received ? ` ${esc(relTime(s2.received))}` : '') +
          ' · the PM shapes this into a ticket next pass</div></div>';
      });
      h += '</div>';
    }

    h += '<div class="section"><div class="h">Give the team something to build</div>' +
      '<div class="intake-box">' +
      '<input id="eng-intake-title" placeholder="What do you want built?" />' +
      '<textarea id="eng-intake-desc" rows="3" placeholder="Any context worth having (optional)"></textarea>' +
      '<div class="row"><button class="btn yes" onclick="engIntake()">Send to the PM</button>' +
      '<span class="note-text" id="eng-intake-note">The Product Manager shapes it, writes the spec, and brings back a recommendation before anything gets built.</span></div>' +
      '</div></div>';
  }

  if (engView === 'board') {
    const GROUPS = [
      ['To-do',        ['intake', 'shaped', 'awaiting-scope']],
      ['In progress',  ['designed', 'awaiting-decision', 'ready', 'building', 'in-review', 'in-qa', 'in-security']],
      ['Ready to ship',['ready-to-ship', 'awaiting-release']],
      ['Done',         ['shipped', 'verified', 'advised']],
      ['Blocked',      ['blocked']],
      ['Dropped',      ['dropped']],
    ];
    const PRIO_COLS = ['To-do'];
    const WAITING_ON_YOU = ['awaiting-scope', 'awaiting-decision', 'awaiting-release'];
    const PRIO_RANK = { now: 0, next: 1, '': 2, hold: 3 };

    const droppedCount = (d.by_state['dropped'] || []).length;
    if (droppedCount) {
      h += '<div class="boardbar">' +
        `<button class="prio-btn${engShowDropped ? ' on' : ''}" onclick="engToggleDropped()">` +
        `${engShowDropped ? 'hide' : 'show'} dropped · ${droppedCount}</button></div>`;
    }

    const cols = GROUPS
      .filter(([name]) => name !== 'Dropped' || engShowDropped)
      .map(([name, states]) => {
        const items = [];
        states.forEach(st => (d.by_state[st] || []).forEach(t => items.push([st, t])));
        if (name === 'To-do') {
          items.sort((a, b) => (PRIO_RANK[a[1].priority || ''] ?? 2) - (PRIO_RANK[b[1].priority || ''] ?? 2));
        }
        return [name, items];
      })
      .filter(([name, items]) => name !== 'Dropped' || items.length);

    const anyTickets = cols.some(([, items]) => items.length);
    if (!anyTickets) {
      h += '<div class="empty">Nothing on the board yet.</div>';
    } else {
      h += '<div class="lanes">';
      cols.forEach(([name, items]) => {
        h += `<div class="lane"><div class="lane-h">${esc(name)} · ${items.length}</div>`;
        if (!items.length) h += '<div class="lane-empty">—</div>';
        items.forEach(([st, t]) => {
          // "1/1 in flight" in the stats bar and "Right now" above only ever
          // named ONE ticket at a time by id — nothing on the board itself
          // said which of these cards that was, or what stage it was
          // actually in mid-pass. d.activity carries both (current_ticket,
          // current_event), so a card matching it gets a live badge with the
          // real verb (eventVerb — "Building", "Applying decision", etc.,
          // same vocabulary "Right now" uses) instead of a generic label.
          const isLive = d.activity && d.activity.running && d.activity.current_ticket === t.id;
          const tags = [];
          tags.push(`<span class="tag stage">${esc(st)}</span>`);
          if (isLive) tags.push(`<span class="tag live">● ${esc(eventVerb(d.activity))}</span>`);
          if (WAITING_ON_YOU.includes(st) || t.blocked_on === 'approver') {
            tags.push('<span class="tag gate">waiting on you</span>');
          }
          if (t.priority) tags.push(`<span class="tag prio-${esc(t.priority)}">${esc(t.priority)}</span>`);
          if (t.lane && t.lane !== 'full') tags.push(`<span class="tag">${esc(t.lane)}</span>`);

          let mergeControls = '';
          if (st === 'blocked' && t.pr_url) {
            mergeControls = '<div class="prio-row">' +
              `<a class="prio-btn" href="${esc(t.pr_url)}" target="_blank" rel="noopener">open PR</a>` +
              `<button class="prio-btn" onclick="engMergeCheck('${esc(t.id)}')">check if merged</button>` +
              `<button class="prio-btn" onclick="engMergeCheck('${esc(t.id)}', true)">mark merged</button>` +
              '</div>';
          }

          let controls = '';
          if (PRIO_COLS.includes(name)) {
            const canHold = !ENG_WORKING_STATES.includes(st);
            const opt = (v, label) =>
              `<button class="prio-btn${t.priority === v ? ' on' : ''}" onclick="engPriority('${esc(t.id)}','${v}')">${label}</button>`;
            controls = '<div class="prio-row">' +
              opt('now', 'now') + opt('next', 'next') +
              (canHold ? opt('hold', 'hold') : '') +
              (t.priority ? opt('', 'clear') : '') + '</div>';
          }
          const timeBits = [];
          if (t.time_spent || t.time_remaining) {
            if (t.time_spent) timeBits.push(`${esc(t.time_spent)} spent`);
            if (t.time_remaining) timeBits.push(`${esc(t.time_remaining)} left`);
          } else if (t.time_estimate) {
            timeBits.push(`est. ${esc(t.time_estimate)}`);
          }
          const timeLine = timeBits.length ? `<div class="sub">${timeBits.join(' · ')}</div>` : '';
          h += `<div class="mini${isLive ? ' mini-active' : ''}">` +
               `<div class="mini-title">${esc(t.title)}</div>` +
               `<div class="mini-tags">${tags.join('')}</div>` +
               `<div class="sub">${esc(t.id)} · ${esc(t.project)} · ${esc(t.owner)}</div>` +
               timeLine +
               mergeControls + controls + '</div>';
        });
        h += '</div>';
      });
      h += '</div>';
    }
  }

  if (engView === 'bugs') {
    h += '<div class="section"><div class="h">Open bugs <span class="count">' + d.bugs.length + '</span></div>';
    if (!d.bugs.length) h += '<div class="card"><div class="body-text">No open bugs.</div></div>';
    d.bugs.forEach(b => {
      const sev = (b.severity || '').toLowerCase();
      h += '<div class="card"><div class="row">' +
        `<span class="tag ${esc(sev)}">${esc(b.severity)}</span>` +
        `<span class="title">${esc(b.title)}</span></div>` +
        `<div class="meta">${esc(b.id)} · ${esc(b.project)} · owner ${esc(b.owner)} · ${esc(b.age)}</div></div>`;
    });
    h += '</div>';
  }

  el.innerHTML = h;
}

async function engDecide(file, decision, noteId) {
  const noteEl = noteId ? document.getElementById(noteId) : null;
  const note = noteEl ? noteEl.value.trim() : '';
  if (decision === 'changed' && !note) {
    if (noteEl) noteEl.focus();
    alert('Add a note describing the change you want — "changed" needs something to change.');
    return;
  }
  const r = await fetch('/api/eng/decide', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file, decision, note, instance: engInstance }),
  });
  if (!r.ok) { const e = await r.json(); alert(e.error || 'Failed'); return; }
  loadEng();
}

async function engPriority(ticket, priority) {
  const r = await fetch('/api/eng/priority', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticket, priority, instance: engInstance }),
  });
  if (!r.ok) { const e = await r.json(); alert(e.error || 'Failed'); return; }
  loadEng();
}

async function engMergeCheck(ticket, force) {
  if (force && !confirm(`Mark ${ticket} as merged?\n\nOnly do this if you actually merged the PR. It advances the ticket to shipped without checking git.`)) return;
  const r = await fetch('/api/eng/merge-check', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticket, force: !!force, instance: engInstance }),
  });
  const d = await r.json();
  if (!r.ok) { alert(d.error || 'Failed'); return; }
  if (!d.merged) {
    alert(`${ticket} does not look merged yet.\n\n${d.detail}` + (d.hint ? `\n\n${d.hint}` : ''));
    return;
  }
  loadEng();
}

async function engIntake() {
  const t = document.getElementById('eng-intake-title');
  const dsc = document.getElementById('eng-intake-desc');
  const note = document.getElementById('eng-intake-note');
  if (!t.value.trim()) { t.focus(); return; }
  const r = await fetch('/api/eng/intake', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: t.value, description: dsc.value, instance: engInstance }),
  });
  if (!r.ok) { const e = await r.json(); alert(e.error || 'Failed'); return; }
  t.value = ''; dsc.value = '';
  note.textContent = 'Received — the Product Manager is shaping it now, usually a few minutes. It\'ll show up under "Waiting to be shaped" below until it becomes a ticket.';
  loadEng();
}

// ══════════════════════════════════════════════════════════════════════════
// Cost — spend by agent/model/routine/business
// ══════════════════════════════════════════════════════════════════════════
let costData = null;
let costDays = 7;

function setCostDays(n) {
  costDays = n;
  document.querySelectorAll('[data-cdays]').forEach(b => b.classList.toggle('active', Number(b.dataset.cdays) === n));
  loadCost();
}

async function loadCost() {
  const el = document.getElementById('cost-scroll');
  el.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch('/api/costs?days=' + costDays);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    costData = await r.json();
  } catch (e) {
    el.innerHTML = `<div class="empty">Could not load costs: ${esc(String(e))}</div>`;
    return;
  }
  renderCost();
}

function costMoney(n) { return '$' + (n || 0).toFixed(2); }
function costTokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n || 0);
}

function costTable(title, rows, keyLabel, keyField, extraCols) {
  let h = `<div class="section"><div class="h">${title} <span class="count">${rows.length}</span></div>` +
    `<table class="cost-table"><tr><th>${keyLabel}</th>` +
    (extraCols || []).map(c => `<th>${c}</th>`).join('') +
    '<th>Runs</th><th>Cost</th><th>Avg run</th><th>Tokens</th><th>Err</th></tr>';
  const maxCost = Math.max(...rows.map(r => r.cost), 0.0001);
  rows.forEach(r => {
    h += `<tr><td><span class="cost-name">${esc(r[keyField])}</span>` +
         (keyField === 'agent' || keyField === 'routine'
           ? `<div class="cost-bar" style="width:${Math.max(2, (r.cost / maxCost) * 100)}%"></div>` : '') +
         '</td>' +
         (extraCols || []).map(c => {
           if (c === 'Tier') return `<td><span class="cost-tier ${esc(r.tier || 'unmapped')}">${esc(r.tier || 'unmapped')}</span> <span style="color:var(--muted)">${esc(r.model || '')}</span></td>`;
           return '<td></td>';
         }).join('') +
         `<td>${r.runs}</td><td>${costMoney(r.cost)}</td><td>${costMoney(r.avg_cost)}</td>` +
         `<td>${costTokens(r.tokens)}</td><td class="${r.errors ? 'cost-flag' : ''}">${r.errors || '—'}</td></tr>`;
  });
  h += '</table></div>';
  return h;
}

function renderCost() {
  const d = costData, el = document.getElementById('cost-scroll');
  if (!d) return;
  if (!d.runs) {
    el.innerHTML = '<div class="empty">No runs recorded in the last ' + d.days + ' days.<br>' +
      '<span style="font-size:11px;color:var(--muted)">Rows are written by departments/engineering/lib/run-stream.py on every ' +
      '<code>claude -p</code> run under an engineering instance.</span></div>';
    return;
  }

  let h = '<div class="cost-stats">' +
    `<div class="cost-stat"><b>${costMoney(d.total_cost)}</b><span>total, ${d.days} days</span></div>` +
    `<div class="cost-stat"><b>${d.runs}</b><span>runs</span></div>` +
    `<div class="cost-stat"><b>${costMoney(d.avg_cost)}</b><span>average run</span></div>` +
    `<div class="cost-stat"><b class="${d.errors ? 'cost-flag' : ''}">${d.errors || '—'}</b><span>errored</span></div>` +
    `<div class="cost-stat"><b class="${d.drift ? 'cost-flag' : ''}">${d.drift || '—'}</b><span>model drift</span></div>` +
    '</div>';

  if (d.by_business.length > 1) h += costTable('Spend by business', d.by_business, 'Business', 'business');
  h += costTable('Spend by agent', d.by_agent, 'Agent', 'agent');
  h += costTable('Spend by model billed', d.by_model, 'Model', 'model');
  h += costTable('Spend by routine', d.by_routine, 'Routine', 'routine', ['Tier']);
  if (d.by_version.length > 1) h += costTable('Spend by agent version', d.by_version, 'Version', 'version');

  h += `<div class="cost-note">${esc(d.note)}<br>` +
       'Tiers resolve through <code>departments/engineering/lib/model-tier.sh</code>: ' +
       Object.entries(d.tiers || {}).map(([t, m]) => `${esc(t)} → ${esc(m)}`).join(' · ') + '.' +
       (d.drift ? '<br><span class="cost-flag">Model drift means a run asked for one model and billed another.</span>' : '') +
       '</div>';

  el.innerHTML = h;
}

// ══════════════════════════════════════════════════════════════════════════
// Logs — logs/*.log tail viewer
// ══════════════════════════════════════════════════════════════════════════
let currentLog = null;

async function loadLogList() {
  const el = document.getElementById('logs-list');
  try {
    const r = await fetch('/api/logs');
    const d = await r.json();
    const files = d.files || [];
    if (!files.length) {
      el.innerHTML = '<div class="empty">No log files yet.</div>';
      return;
    }
    el.innerHTML = files.map(f => `<div class="log-item${f.name === currentLog ? ' active' : ''}"
        onclick="viewLog('${escAttr(f.name)}')">
      <div>${esc(f.name)}</div>
      <div class="sub">${(f.size / 1024).toFixed(1)} KB · ${esc(relTime(new Date(f.mtime * 1000).toISOString()))}</div>
    </div>`).join('');
    if (!currentLog && files.length) viewLog(files[0].name);
  } catch (e) {
    el.innerHTML = '<div class="empty">Error loading log list.</div>';
  }
}

async function viewLog(name) {
  currentLog = name;
  document.querySelectorAll('.log-item').forEach(el =>
    el.classList.toggle('active', el.textContent.trim().startsWith(name)));
  const main = document.getElementById('logs-main');
  main.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch('/api/logs/view?name=' + encodeURIComponent(name));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    main.innerHTML = `<div class="meta" style="margin-bottom:10px">Showing last ${d.shown} of ${d.total_lines} lines</div>` +
      `<div class="log-text">${esc(d.text) || '(empty)'}</div>`;
  } catch (e) {
    main.innerHTML = `<div class="empty">Error loading log: ${esc(String(e))}</div>`;
  }
  loadLogList();
}

// ── Init ─────────────────────────────────────────────────────────────────
loadMarketing();
</script>
