<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business OS — Control Center</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --card: #1e1e24;
    --border: #2a2a35;
    --border-light: #32323f;
    --text: #e2e2ec;
    --muted: #5c5c72;
    --muted-mid: #8888a0;
    --agent: #8b5cf6;
    --danger: #f87171;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; }

  .card { width: 100%; max-width: 320px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 26px; margin: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .logo { width: 28px; height: 28px; background: linear-gradient(135deg, var(--agent), #6366f1);
    border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .brand-title { font-size: 14px; font-weight: 600; }
  .brand-title span { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; margin-top: 1px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; }
  .field input { width: 100%; background: var(--bg); border: 1px solid var(--border-light);
    border-radius: 6px; padding: 10px 11px; color: var(--text); font-family: inherit; font-size: 14px; }
  .field input:focus { outline: none; border-color: var(--agent); }

  .submit { width: 100%; margin-top: 6px; padding: 10px 14px; font-size: 13px; font-weight: 600;
    font-family: inherit; border-radius: 7px; cursor: pointer; border: 1px solid var(--agent);
    background: rgba(139,92,246,.14); color: var(--text); transition: background .12s; }
  .submit:hover { background: rgba(139,92,246,.24); }
  .submit:disabled { opacity: .55; cursor: default; }

  .msg { font-size: 12px; margin-top: 12px; line-height: 1.5; min-height: 1px; }
  .msg.error { color: var(--danger); }
  .msg.hint { color: var(--muted); }
</style>
</head>
<body>

<form class="card" id="login-form" autocomplete="on">
  <div class="brand">
    <div class="logo">⚙</div>
    <div class="brand-title">Business OS<span>Control Center</span></div>
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username" required autofocus />
  </div>
  <div class="field">
    <label for="pin">PIN</label>
    <input type="password" id="pin" name="pin" inputmode="numeric" autocomplete="current-password"
           maxlength="12" required />
  </div>

  <button type="submit" class="submit" id="submit-btn">Sign in</button>
  <div class="msg" id="msg"></div>
</form>

<script>
const form = document.getElementById('login-form');
const btn = document.getElementById('submit-btn');
const msg = document.getElementById('msg');

function setMsg(text, cls) {
  msg.textContent = text || '';
  msg.className = 'msg' + (cls ? ' ' + cls : '');
}

// Already signed in? Skip the form.
fetch('/api/auth/me').then(r => r.json()).then(d => {
  if (d && d.email) window.location.href = '/';
}).catch(() => {});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  setMsg('Signing in…', 'hint');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        pin: document.getElementById('pin').value,
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      window.location.href = '/';
      return;
    }
    setMsg(d.error || `Sign-in failed (${r.status})`, 'error');
  } catch (err) {
    setMsg('Network error — try again.', 'error');
  }
  btn.disabled = false;
});
</script>
</body>
</html>
