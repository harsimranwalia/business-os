<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>Sign in — Business OS</title>
  <link rel="stylesheet" href="/ui/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='4' fill='%23EDEDEF'/%3E%3Crect x='9' y='9' width='6' height='6' fill='%230A0A0B'/%3E%3C/svg%3E" />
</head>
<body>
<div class="login">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h16v16H4z" fill="currentColor"/><path d="M9 9h6v6H9z" fill="#EDEDEF"/></svg></div>
      <div class="brand-name">Business OS<small>Control Center</small></div>
    </div>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required autofocus spellcheck="false" />
      </div>
      <div class="field">
        <label for="pin">PIN</label>
        <input type="password" id="pin" name="pin" inputmode="numeric" autocomplete="current-password" maxlength="12" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">Sessions last 30 days on this device.</div>
  </div>
</div>
<script>
const form = document.getElementById('login-form');
const btn = document.getElementById('submit-btn');
const msg = document.getElementById('msg');
function setMsg(text, cls) { msg.textContent = text || ''; msg.className = 'msg ' + (cls || ''); }
// Already signed in? Skip the form.
fetch('/api/auth/me').then(r => r.json()).then(d => { if (d && d.email) window.location.href = '/'; }).catch(() => {});
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  setMsg('Signing in…', 'msg-dim');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, pin: document.getElementById('pin').value }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { window.location.href = '/'; return; }
    setMsg(d.error || `Sign-in failed (${r.status})`, 'msg-bad');
  } catch (err) {
    setMsg('Network error — try again.', 'msg-bad');
  }
  btn.disabled = false;
});
</script>
</body>
</html>
